<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtos</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <h1>Cadastro de Produtos</h1>

  <!-- Formulário de Cadastro -->
  <form id="productForm">
    <input type="text" id="nome" placeholder="Nome do Produto" required>
    <input type="text" id="codigo" placeholder="Código Interno" required>
    <textarea id="descricao" placeholder="Descrição"></textarea>
    <input type="number" id="quantidade" placeholder="Quantidade Inicial" value="1">
    <button type="submit">Cadastrar Produto</button>
  </form>

  <!-- Busca -->
  <input type="text" id="search" placeholder="Buscar por nome ou QR Code">

  <!-- Lista de Produtos -->
  <div id="productList"></div>

  <!-- Tarefas de Coleta -->
  <h2>Tarefas de Coleta</h2>
  <button onclick="criarTarefa()">Criar Nova Tarefa de Coleta</button>
  <div id="tarefasList"></div>

  <script src="js/products.js"></script>
</body>
</html>
